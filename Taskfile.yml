version: "3"

# Flexwall — raccourcis.
#   task dev      serveur local (murs en mémoire, sans Stripe)
#   task check    typecheck + tests + build + tests fonctionnels
#   task deploy   build, push, déploie le service Cloud Run "flexwall"
#   task samples  rend les 6 thèmes dans .tmp/ pour les regarder

vars:
  PROJECT_ID: ghota-outflex-prod
  REGION: europe-west1
  SERVICE: flexwall

tasks:
  default:
    cmds: [task --list]
    silent: true

  dev:
    desc: Serveur de développement sur :3000
    cmds: [bun run dev]

  check:
    desc: Typecheck, tests unitaires, build, tests fonctionnels
    cmds: [bun run check]

  test:firestore:
    desc: Tests du store contre l'émulateur Firestore (docker)
    cmds:
      - docker start fw-firestore-emulator 2>/dev/null || docker run -d --name fw-firestore-emulator -p 8080:8080 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators gcloud beta emulators firestore start --host-port=0.0.0.0:8080
      - sleep 3
      - FIRESTORE_EMULATOR_HOST=localhost:8080 GOOGLE_PROJECT_ID=demo-flexwall bun test tests/unit/walls.test.ts

  samples:
    desc: Rend chaque thème en PNG dans .tmp/
    cmds:
      - mkdir -p .tmp
      - bun scripts/render-sample.tsx .tmp

  deploy:
    desc: Build l'image, la pousse et déploie (gcloud uniquement, jamais terraform)
    cmds:
      - bash scripts/deploy.sh

  logs:
    desc: 50 dernières lignes de log Cloud Run
    cmds:
      - >-
        gcloud logging read
        'resource.type=cloud_run_revision AND resource.labels.service_name={{.SERVICE}}'
        --project {{.PROJECT_ID}} --limit 50 --format "value(timestamp,textPayload)"
