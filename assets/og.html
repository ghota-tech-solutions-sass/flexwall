<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Source de public/og.png (1200×630) — l'aperçu social de l'accueil.
  Régénérer avec `task og` après toute modification.
  Les couleurs doivent rester alignées sur src/lib/brand.ts.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #000000;
    color: #ececec;
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .frame { position: absolute; inset: 20px; border: 1px solid #2c2c31; }
  .in { text-align: center; position: relative; padding: 0 90px; margin-top: -30px; }
  .brand {
    font-size: 26px; letter-spacing: 6px; color: #e2b340; font-weight: 700;
    margin-bottom: 44px;
  }
  h1 { font-size: 72px; font-weight: 700; line-height: 1.14; letter-spacing: -2px; }
  h1 .gold { color: #e2b340; }
  .sub { margin-top: 34px; font-size: 28px; color: #ececec; font-weight: 500; }
  .dim { color: #8f8f98; font-weight: 400; }
  .cta {
    position: absolute; bottom: 46px; left: 0; right: 0;
    display: flex; justify-content: center;
  }
  .cta span {
    border: 1px solid #e2b340; padding: 12px 30px;
    font-size: 30px; font-weight: 700; letter-spacing: 1px; color: #ececec;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="in">
    <div class="brand">FLEXWALL.LOL</div>
    <h1>The internet&rsquo;s <span class="gold">most&nbsp;expensive</span> leaderboard.</h1>
    <div class="sub">Pay more. Take the spot. <span class="dim">Someone can always outbid you.</span></div>
  </div>
  <div class="cta"><span>TAKE A SPOT</span></div>
</body>
</html>
