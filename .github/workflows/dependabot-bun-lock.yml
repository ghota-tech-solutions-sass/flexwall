name: Dependabot bun.lock sync

# Dependabot updates package.json but not bun.lock — its npm PRs then fail
# CI on `bun install --frozen-lockfile`. This job regenerates bun.lock and
# commits it back to the Dependabot PR branch so CI can pass.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Commit synced lockfile
        run: |
          if ! git diff --quiet bun.lock; then
            git config user.name "dependabot[bot]"
            git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
            git commit -am "chore: sync bun.lock with package.json"
            git push
          fi
