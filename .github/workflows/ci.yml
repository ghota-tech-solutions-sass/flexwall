name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # SDK, plugins, domain, use cases, adapters (in-memory store), editor
      - run: bun run test
      - run: bun run build
      # Boots the standalone server and walks sign-in, publish, images, webhooks
      - run: bun run test:functional

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: flexwall:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to Cloud Run
    needs: [ci, docker]
    # Deploy on a version tag (cut by Release Please) or a manual run, never on
    # a plain commit to main.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write # Workload Identity Federation

    env:
      PROJECT_ID: ghota-outflex-prod
      REGION: europe-west1
      REPO_NAME: flexwall-repo
      SERVICE_NAME: flexwall
      IMAGE_NAME: flexwall
      # Baked into the build for metadata and the sitemap; the running service
      # gets its origin from Terraform at runtime.
      APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://flexwall.lol' }}

    steps:
      - uses: actions/checkout@v7

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Image only: env vars, secrets and scaling belong to Terraform.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          for path in / /explore /pricing /demo/card.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL$path")
            echo "$code $path"
            test "$code" = "200"
          done
          echo "### Deployed ${{ github.sha }} to $URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Tell Bing and the other IndexNow engines that pages changed. A refusal
      # doesn't undo a good deploy: the step reports, it doesn't block.
      - name: Submit sitemap to IndexNow
        continue-on-error: true
        run: bun scripts/seo/indexnow.ts ${{ env.APP_URL }}
