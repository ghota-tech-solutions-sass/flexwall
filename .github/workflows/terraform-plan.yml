name: Terraform Plan

on:
  workflow_dispatch:

# Manual plan for production infrastructure. The Stripe key is read from Secret
# Manager by Terraform itself, so no Stripe secret lives in GitHub.

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_github_token: ${{ secrets.TF_VAR_GITHUB_TOKEN }}
  # JSON object by env name, e.g. {"STEAM_API_KEY":"…","TWITCH_CLIENT_ID":"…"}; empty keeps connectors off.
  TF_VAR_connector_secrets: ${{ secrets.TF_VAR_CONNECTOR_SECRETS || '{}' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false
