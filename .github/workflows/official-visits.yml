name: Connect official visits
on:
  workflow_dispatch:
concurrency:
  group: connect-official-visits
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          project_id: ghota-outflex-prod
      - name: Add live visits widgets to the existing official wall
        env:
          GOOGLE_PROJECT_ID: ghota-outflex-prod
        run: bun --tsconfig-override apps/web/tsconfig.json scripts/connect-official-visits.ts
